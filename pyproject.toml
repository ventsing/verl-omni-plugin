[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-omni-plugin"
version = "0.1.0"
description = "Plugin framework for verl, verl-omni, vllm, and vllm-omni with audio and full-duplex support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["verl", "vllm", "reinforcement-learning", "multimodal", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
verl = [
    "verl>=0.6.0",
]
verl-omni = [
    "verl-omni>=0.2.0",
]
vllm = [
    "vllm>=0.6.0",
]
vllm-omni = [
    "vllm-omni>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "verl-omni-plugin[verl,verl-omni,vllm,vllm-omni,dev]",
]

[project.entry-points."verl.platform_plugins"]
custom = "plugins.verl.platform:CustomPlatform"

[project.entry-points."vllm.general_plugins"]
verl_omni_plugin = "plugins:register_vllm_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "plugins*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
